<rect x="0" y="0" width="560" height="330" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="140" cy="150" r="40" fill="#e5e7eb"/>
<circle cx="420" cy="150" r="100" fill="#e5e7eb"/>
<circle cx="140" cy="150" r="5" fill="#1f2937"/><circle cx="420" cy="150" r="5" fill="#1f2937"/>
<line x1="131.4" y1="110.9" x2="398.6" y2="52.3" stroke-width="4"/>
<line x1="131.4" y1="189.1" x2="398.6" y2="247.7" stroke-width="4"/>
<text x="140" y="230" font-size="15" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">Motor pulley</text><text x="140" y="252" font-size="15" text-anchor="middle" fill="#1f2937" stroke="none">4 in diameter</text><text x="140" y="274" font-size="15" text-anchor="middle" fill="#1f2937" stroke="none">1,800 rpm</text>
