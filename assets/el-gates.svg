<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" width="600" height="210" role="img" aria-label="Logic circuit where A and B feed an AND gate whose output and C feed an OR gate giving Q">
<title>Logic circuit where A and B feed an AND gate whose output and C feed an OR gate giving Q</title>
<rect x="0" y="0" width="600" height="210" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M 160 60 L 200 60 A 40 40 0 0 1 200 140 L 160 140 Z"/>
<line x1="80" y1="80" x2="160" y2="80" /><line x1="80" y1="120" x2="160" y2="120" />
<text x="65" y="86" font-size="16" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">A</text><text x="65" y="126" font-size="16" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">B</text>
<path d="M 320 85 Q 345 125 320 165 Q 385 165 430 125 Q 385 85 320 85 Z"/>
<line x1="240" y1="100" x2="280" y2="100" /><line x1="280" y1="100" x2="280" y2="105" /><line x1="280" y1="105" x2="331" y2="105" />
<line x1="80" y1="145" x2="331" y2="145" />
<text x="65" y="151" font-size="16" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">C</text>
<line x1="430" y1="125" x2="500" y2="125" /><text x="515" y="131" font-size="16" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">Q</text>
<text x="200" y="175" font-size="13" text-anchor="middle" fill="#1f2937" stroke="none">AND</text><text x="370" y="190" font-size="13" text-anchor="middle" fill="#1f2937" stroke="none">OR</text>
<text x="300" y="30" font-size="15" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">Logic circuit: Q = (A AND B) OR C</text>
</g>
</svg>
