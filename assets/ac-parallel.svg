<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Parallel circuit with 40, 40 and 20 ohm resistors across 120 volts">
<title>Parallel circuit with 40, 40 and 20 ohm resistors across 120 volts</title>
<rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<line x1="80" y1="60" x2="80" y2="134" /><line x1="64" y1="134" x2="96" y2="134" stroke-width="3"/><line x1="72" y1="146" x2="88" y2="146" stroke-width="3"/><line x1="80" y1="146" x2="80" y2="240" />
<text x="50" y="145" font-size="15" text-anchor="end" fill="#1f2937" stroke="none">120 V</text>
<line x1="80" y1="60" x2="520" y2="60" /><line x1="80" y1="240" x2="520" y2="240" />
<line x1="240" y1="60" x2="240" y2="110" /><polyline points="240,110 230,116.7 250,130.0 230,143.3 250,156.7 230,170.0 250,183.3 240,190"/><line x1="240" y1="190" x2="240" y2="240" />
<text x="258" y="155" font-size="14" text-anchor="start" fill="#1f2937" stroke="none">R1 = 40 Ω</text>
<line x1="380" y1="60" x2="380" y2="110" /><polyline points="380,110 370,116.7 390,130.0 370,143.3 390,156.7 370,170.0 390,183.3 380,190"/><line x1="380" y1="190" x2="380" y2="240" />
<text x="398" y="155" font-size="14" text-anchor="start" fill="#1f2937" stroke="none">R2 = 40 Ω</text>
<line x1="520" y1="60" x2="520" y2="110" /><polyline points="520,110 510,116.7 530,130.0 510,143.3 530,156.7 510,170.0 530,183.3 520,190"/><line x1="520" y1="190" x2="520" y2="240" />
<text x="538" y="155" font-size="14" text-anchor="start" fill="#1f2937" stroke="none">R3 = 20 Ω</text>
<text x="300" y="280" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none">Three resistors in parallel across 120 V.</text>
</g>
</svg>
