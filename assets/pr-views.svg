<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Front and top views of a stepped block in third-angle projection">
<title>Front and top views of a stepped block in third-angle projection</title>
<rect x="0" y="0" width="600" height="440" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<polygon points="80,360 240,360 240,320 160,320 160,280 80,280"/>
<text x="160" y="390" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">FRONT</text>
<rect x="80" y="100" width="160" height="120"/>
<line x1="160" y1="100" x2="160" y2="220" />
<text x="160" y="88" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">TOP</text>
<text x="390.0" y="390" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">RIGHT SIDE = ?</text>
<rect x="330" y="280" width="120" height="80" stroke-dasharray="6 6" stroke="#9ca3af"/>
<text x="390.0" y="266" font-size="12" text-anchor="middle" fill="#6b7280" stroke="none">(space for the right side view)</text>
<text x="300" y="30" font-size="16" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">Third-angle projection of a stepped block</text>
<text x="300" y="420" font-size="13" text-anchor="middle" fill="#1f2937" stroke="none">The block is 4 wide and 3 deep. The tall part is 2 high, the low step is 1 high.</text>
</g>
</svg>
