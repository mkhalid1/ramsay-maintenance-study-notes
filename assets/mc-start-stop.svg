<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" aria-label="Ladder diagram of a three-wire start stop circuit with a holding contact labelled X">
<title>Ladder diagram of a three-wire start stop circuit with a holding contact labelled X</title>
<rect x="0" y="0" width="700" height="340" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<line x1="60" y1="50" x2="60" y2="330" stroke-width="3"/><line x1="640" y1="50" x2="640" y2="330" stroke-width="3"/>
<text x="60" y="40" font-size="15" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">L1</text><text x="640" y="40" font-size="15" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">L2</text>
<line x1="60" y1="120" x2="130" y2="120" />
<circle cx="135" cy="120" r="5"/><circle cx="185" cy="120" r="5"/>
<line x1="130" y1="128" x2="190" y2="128" /><line x1="160" y1="128" x2="160" y2="98" /><line x1="150" y1="98" x2="170" y2="98" />
<text x="160" y="154" font-size="13" text-anchor="middle" fill="#1f2937" stroke="none">STOP</text>
<line x1="190" y1="120" x2="240" y2="120" />
<circle cx="245" cy="120" r="5"/><circle cx="295" cy="120" r="5"/>
<line x1="240" y1="108" x2="300" y2="108" /><line x1="270" y1="108" x2="270" y2="90" /><line x1="260" y1="90" x2="280" y2="90" />
<text x="270" y="154" font-size="13" text-anchor="middle" fill="#1f2937" stroke="none">START</text>
<line x1="300" y1="120" x2="480" y2="120" />
<line x1="480" y1="120" x2="500" y2="120" /><line x1="500" y1="108" x2="500" y2="132" /><line x1="540" y1="108" x2="540" y2="132" /><line x1="502" y1="130" x2="538" y2="110" /><line x1="540" y1="120" x2="560" y2="120" />
<text x="520" y="154" font-size="13" text-anchor="middle" fill="#1f2937" stroke="none">OL</text>
<circle cx="590" cy="120" r="20"/><text x="590" y="126" font-size="15" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">M</text>
<line x1="560" y1="120" x2="570" y2="120" /><line x1="610" y1="120" x2="640" y2="120" />
<line x1="225" y1="120" x2="225" y2="210" /><line x1="225" y1="210" x2="250" y2="210" />
<line x1="250" y1="196" x2="250" y2="224" /><line x1="290" y1="196" x2="290" y2="224" />
<line x1="290" y1="210" x2="315" y2="210" /><line x1="315" y1="210" x2="315" y2="120" />
<text x="270" y="248" font-size="13" text-anchor="middle" fill="#1f2937" stroke="none">M (contact X)</text>
<text x="350" y="300" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none">Three-wire start/stop control. Contact X is operated by coil M.</text>
</g>
</svg>
