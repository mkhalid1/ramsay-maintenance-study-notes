<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 230" width="690" height="230" role="img" aria-label="Four candidate right side views labelled A to D">
<title>Four candidate right side views labelled A to D</title>
<rect x="0" y="0" width="690" height="230" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="40" y="110" width="90" height="60"/>
<line x1="40" y1="140" x2="130" y2="140" />
<text x="85.0" y="205" font-size="22" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">A</text>
<rect x="210" y="110" width="90" height="60"/>
<line x1="210" y1="140" x2="300" y2="140" stroke-dasharray="8 5"/>
<text x="255.0" y="205" font-size="22" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">B</text>
<rect x="380" y="110" width="90" height="60"/>
<line x1="425.0" y1="110" x2="425.0" y2="170" />
<text x="425.0" y="205" font-size="22" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">C</text>
<rect x="550" y="110" width="90" height="60"/>
<text x="595.0" y="205" font-size="22" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">D</text>
<text x="340" y="40" font-size="15" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">Options for the right side view (3 deep by 2 high)</text>
</g>
</svg>
