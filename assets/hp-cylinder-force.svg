<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="Double-acting cylinder with piston area 12 square inches and rod area 4 square inches">
<title>Double-acting cylinder with piston area 12 square inches and rod area 4 square inches</title>
<rect x="0" y="0" width="700" height="300" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="80" y="80" width="320" height="120"/>
<rect x="240" y="82" width="20" height="116" fill="#e5e7eb"/>
<rect x="260" y="126" width="260" height="28" fill="#e5e7eb"/>
<line x1="110" y1="80" x2="110" y2="50" /><line x1="370" y1="80" x2="370" y2="50" />
<text x="110" y="40" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none">Cap-end port</text>
<text x="370" y="40" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none">Rod-end port</text>
<text x="160" y="145" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none">Piston area</text><text x="160" y="165" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">12 sq in</text>
<text x="600" y="185" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none">Rod cross-section</text><text x="600" y="203" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">4 sq in</text>
<text x="300" y="250" font-size="16" text-anchor="middle" fill="#1f2937" stroke="none">Supply pressure: 1,500 psi. Ignore friction.</text>
<text x="300" y="280" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none">Areas are labelled. Rod area is the cross-section of the rod.</text>
</g>
</svg>
