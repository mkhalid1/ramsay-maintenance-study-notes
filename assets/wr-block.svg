<rect x="0" y="0" width="480" height="385" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<line x1="60" y1="40" x2="400" y2="40" stroke-width="5"/>
<circle cx="190" cy="80" r="22"/>
<circle cx="250" cy="80" r="22"/>
<line x1="220" y1="40" x2="220" y2="58" />
<circle cx="190" cy="230" r="22"/>
<circle cx="250" cy="230" r="22"/>
<line x1="220" y1="252" x2="220" y2="280" />
<rect x="170" y="280" width="100" height="50" fill="#e5e7eb"/>
<text x="220" y="311" font-size="16" text-anchor="middle" fill="#1f2937" stroke="none" font-weight="bold">800 lb</text>
<line x1="168" y1="80" x2="168" y2="230" stroke="#1d4ed8" stroke-width="2.5"/>
