<text x="345" y="235" font-size="15" text-anchor="start" fill="#1f2937" stroke="none">Pull</text>
<text x="240" y="365" font-size="14" text-anchor="middle" fill="#1f2937" stroke="none">Count the rope segments that hold up the lower block (shown in blue).</text>
